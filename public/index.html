<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>雪绒人机管理器</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/global.css" />
  <script>
    // 特性检测：backdrop-filter 支持
    (function() {
      var el = document.createElement('div');
      el.style.backdropFilter = 'blur(2px)';
      var ok = CSS.supports ? CSS.supports('backdrop-filter', 'blur(2px)') : el.style.backdropFilter !== '';
      if (!ok) document.documentElement.classList.add('no-backdrop');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
